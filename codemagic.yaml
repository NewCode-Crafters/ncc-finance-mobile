workflows:
  DEV-WORKFLOW:
    name: DEV - Build and Test (PR Validation)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - firebase_config
      flutter: 3.35.7
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: 'task/*'
          include: true
          source: true
        - pattern: 'fix/*'
          include: true
          source: true
        - pattern: 'enhancement/*'
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Run Flutter analyze
        script: |
          flutter analyze
      - name: Run unit tests
        script: |
          flutter test
      - name: Build Android APK (Debug)
        script: |
          flutter build apk --debug

  HOMOLOG-WORKFLOW:
    name: HOMOLOG - Build Staging Artifacts
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - firebase_config
      flutter: 3.35.7
      xcode: latest
      cocoapods: default
      vars:
        FIREBASE_APP_ID: "1:YOUR_APP_ID"
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: 'dev'
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Run Flutter analyze
        script: |
          flutter analyze
      - name: Run unit tests
        script: |
          flutter test
      - name: Build Android APK (Release)
        script: |
          flutter build apk --release
      - name: Build iOS IPA
        script: |
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/ios/ipa/*.ipa
    publishing:
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT
        android:
          app_id: $FIREBASE_APP_ID
          groups:
            - qa-team
            - developers

  PROD-WORKFLOW:
    name: PROD - Build Production Artifacts
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - firebase_config
        - production
      flutter: 3.35.7
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
      cancel_previous_builds: false
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Run Flutter analyze
        script: |
          flutter analyze
      - name: Run unit tests
        script: |
          flutter test
      - name: Build Android APK (Release)
        script: |
          flutter build apk --release
      - name: Build Android App Bundle (Release)
        script: |
          flutter build appbundle --release
      - name: Build iOS IPA (Release)
        script: |
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
      - build/ios/ipa/*.ipa
    publishing:
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT
        android:
          app_id: $FIREBASE_APP_ID
          groups:
            - production-testers
